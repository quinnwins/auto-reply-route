name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Fast checks (Python 3.12 on Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run core and safety checks
        run: >-
          python -m pytest -q
          tests/test_cli.py tests/test_parser.py tests/test_sanitizer.py
          tests/test_runtime_security_and_concurrency.py
          tests/test_queue_cli_and_watch.py

      - name: Validate canonical route playbook
        run: python -m auto_reply_route.cli validate playbooks/ship-feature.route.md
